[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pagedattention-under-pressure"
version = "0.1.0"
description = "Reproducing vLLM PagedAttention block management under memory pressure: fragmentation, preemption and eviction, measured and documented"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/paged_pressure"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
